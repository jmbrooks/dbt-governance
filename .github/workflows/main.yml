# Workflow Configuration
#
# This workflow runs on every push to the main branch and:
#   - Runs all project tests via pytest
#   - Uploads test coverage report to Codecov

name: Main branch deploy steps

on:
  push:
    branches: [ main ]

jobs:
  test-and-coverage:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create venv + install deps (frozen)
        run: |
          uv venv .venv --seed --python 3.12
          uv sync --frozen --group dev

      - name: Run tests
        run: |
          uv run pytest --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
